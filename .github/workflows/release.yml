name: release

# Кросс-платформенная сборка релизных артефактов SmartClip на раннерах GitHub.
#
# РЕЛИЗЫ ТОЛЬКО ВРУЧНУЮ (решение Лёши 08.10.2026): workflow больше НЕ запускается
# на push в main — релизы не создаются автоматически при каждом коммите.
# Запуск: Actions → workflow "release" → "Run workflow" (workflow_dispatch).
# Тогда собираются Linux- и macOS-артефакты из текущего main.
#
# WINDOWS ЗДЕСЬ НЕ СОБИРАЕТСЯ — и это причина, по которой в релизах на GitHub
# до 21.10.2026 лежал только портативный zip: .exe/установщик собираются на
# машине winpc (Qt 6.8.3 MinGW + Inno Setup), а в GitHub-репозитории нет
# Windows-кода и нет доступа к этой машине (решение Лёши 21.10.2026:
# Windows-артефакты публикуются из релиза Forgejo, см. ниже в publish).
#
# Политика по macOS (решение Лёши 07.10.2026): macOS-артефакты в релиз
# АВТОМАТИЧЕСКИ не публикуются. macOS (.app/.zip/.dmg) Лёша добавляет к релизу
# ВРУЧНУЮ. Собрать macOS-комплект локально на маке: scripts/release-macos.sh.
#
# Версия — из файла VERSION.txt (авто-бамп patch на каждый коммит через
# .githooks/pre-commit), тег релиза — v<version>.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG_PREFIX: v

jobs:
  linux:
    name: Linux artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Qt6 + OpenSSL)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              cmake ninja-build g++ pkg-config \
              libssl-dev qt6-base-dev qt6-svg-dev \
              libgl1-mesa-dev libxkbcommon-dev
          sudo apt-get install -y --no-install-recommends qt6-mqtt-dev || \
              echo "Qt6 MQTT недоступен — собираю без синка"

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: scripts/release-linux.sh --jobs "$(nproc)"
        env:
          SMARTCLIP_TOOLS_DIR: ${{ runner.temp }}/smartclip-tools

      - uses: actions/upload-artifact@v4
        with:
          name: smartclip-linux-${{ steps.v.outputs.version }}
          path: dist/release-${{ steps.v.outputs.version }}/*
          if-no-files-found: error

  macos:
    name: macOS artifacts (.app + deps)
    # Только по ручному запуску (workflow_dispatch). При пуше в main джоба
    # пропускается — macOS-артефакты Лёша добавляет к релизу вручную
    # (решение 07.10.2026).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (official Qt6 + OpenSSL)
        # Best-effort: проблемы с macOS-зависимостями не валят весь workflow
        # (Linux-артефакты и релиз важнее). Диагностика — в аннотации.
        continue-on-error: true
        env:
          QT_MACOS_PREFIX: ${{ secrets.QT_MACOS_PREFIX }}
        run: |
          set +e
          {
            brew install cmake openssl@3
            if [ -n "${QT_MACOS_PREFIX:-}" ]; then
              echo "QT_PATH=$QT_MACOS_PREFIX" >> "$GITHUB_ENV"
            else
              # Официальный Qt через aqtinstall: brew-формула 'qt' разбита на
              # keg'и, и macdeployqt на ней падает (QtPdf/QtVirtualKeyboard/…).
              # Венв: системный Python — PEP-668 (externally-managed).
              python3 -m venv "$RUNNER_TEMP/aqt-venv"
              "$RUNNER_TEMP/aqt-venv/bin/pip" install --quiet --upgrade pip aqtinstall
              AQT="$RUNNER_TEMP/aqt-venv/bin/aqt"
              QT_DIR="$RUNNER_TEMP/Qt"; QT_VER=6.8.1
              "$AQT" install-qt mac desktop "$QT_VER" clang_64 \
                  -m qtmqtt qtimageformats --outputdir "$QT_DIR" \
                || "$AQT" install-qt mac desktop "$QT_VER" clang_64 --outputdir "$QT_DIR"
              echo "QT_PATH=$QT_DIR/$QT_VER/macos" >> "$GITHUB_ENV"
              ls "$QT_DIR/$QT_VER/macos/bin/macdeployqt"
            fi
          } >"$RUNNER_TEMP/macos-deps.log" 2>&1
          st=$?
          tail -25 "$RUNNER_TEMP/macos-deps.log"
          [ "$st" -eq 0 ] || echo "::error::deps install failed ($st): $(tail -5 "$RUNNER_TEMP/macos-deps.log" | tr '\n' '|')"
          exit 0

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts (.app + zip + dmg)
        # macOS-пакет — best-effort: сбой (капризы Homebrew-qt/macdeployqt)
        # не должен блокировать выпуск Linux-артефактов в релиз.
        continue-on-error: true
        env:
          QT_MACOS_PREFIX: ${{ secrets.QT_MACOS_PREFIX }}
        run: |
          set +e
          scripts/release-macos.sh --jobs "$(sysctl -n hw.ncpu)" >"$RUNNER_TEMP/macos-build.log" 2>&1
          st=$?
          tail -30 "$RUNNER_TEMP/macos-build.log"
          if [ "$st" -ne 0 ]; then
            # Собираем все ошибки в ОДНУ аннотацию (GitHub режет список аннотаций).
            msg=$(grep -iE 'error:|error C|fatal error|FAILED|cannot|undefined' "$RUNNER_TEMP/macos-build.log" | head -25 | tr '\n' '|')
            echo "::warning::release-macos.sh exit $st (macOS-артефакт пропущен) :: ${msg:-см. лог}"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: smartclip-macos-${{ steps.v.outputs.version }}
          path: dist/release-${{ steps.v.outputs.version }}/*
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: [linux, macos]
    # Публикуем, если Linux-сборка прошла — macOS при обычном пуше пропущен
    # (skipped), а при ручном запуске, если собрался, добавится к релизу.
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Без actions/checkout: checkout делает clean и СТИРАЕТ ранее скачанные
      # артефакты (untracked). Версия приходит из выхода джобы linux.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Без checkout у gh нет git-контекста — задаём репозиторий явно.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set +e
          ( set -euo pipefail
            TAG="${TAG_PREFIX}${VERSION}"
            ls -la artifacts
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "SmartClip $VERSION" \
                --notes "Релиз SmartClip $VERSION (автосборка CI). Артефакты: Linux (AppImage/deb/tar.gz), macOS (.app со вложенными зависимостями)."
            gh release upload "$TAG" artifacts/* --clobber

            # ── Windows-артефакты: забираем из релиза Forgejo ──────────────
            # Сборка .exe/установщика идёт на winpc (Qt MinGW + Inno Setup) и
            # возможна только в Forgejo-пайплайне (<репозиторий>/.forgejo/
            # workflows/release.yml): в этом репозитории нет Windows-кода и нет
            # доступа к winpc. Поэтому Windows-ассеты (zip + setup.exe)
            # копируются из Forgejo — иначе в GitHub-релизе их просто нет
            # (грабля 21.10.2026: был только zip без установщика).
            # Forgejo: /releases/tags/<tag> отдаёт 404 (проверено 21.10.2026) —
            # нужен ?tag=<tag> / /releases?limit=50, поэтому фильтруем по tag_name.
            FJ_API="https://git.halfpi.ru/api/v1/repos/mario/smartclip/releases"
            FJ_JSON="$RUNNER_TEMP/fj-release.json"
            FJ_URLS="$RUNNER_TEMP/fj-urls.txt"
            # Репа на Forgejo приватная: без токена API отдаёт 404 (проверено
            # 21.10.2026). Токен — секрет репозитория FORGEJO_READ_TOKEN
            # (достаточно read:repository). Нет токена — шаг не валим, просто
            # предупреждаем, что Windows-ассетов в GitHub-релизе не будет.
            FJ_TOKEN="${{ secrets.FORGEJO_READ_TOKEN }}"
            FJ_AUTH=()
            [ -n "$FJ_TOKEN" ] && FJ_AUTH=(-H "Authorization: token $FJ_TOKEN")
            if curl -sSf -m 20 "${FJ_AUTH[@]}" "$FJ_API?limit=50" -o "$FJ_JSON" 2>/dev/null; then
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); r=[x for x in d if x.get("tag_name")==sys.argv[3]]; u=[a["browser_download_url"] for x in r for a in x.get("assets",[]) if "windows" in a.get("name","")]; open(sys.argv[2],"w").write("".join(x+"\n" for x in u))' "$FJ_JSON" "$FJ_URLS" "$TAG"
              if [ -s "$FJ_URLS" ]; then
                # Ассеты приватного релиза тоже требуют токен.
                ( cd "$RUNNER_TEMP" && xargs -n1 -P4 curl -sSfL -m 300 -H "Authorization: token $FJ_TOKEN" -O < "$FJ_URLS" )
                echo "Forgejo -> GitHub: добавляю Windows-ассеты:"
                ls -l "$RUNNER_TEMP"/SmartClip-*-windows-*
                gh release upload "$TAG" "$RUNNER_TEMP"/SmartClip-*-windows-* --clobber
              else
                echo "::warning::в релизе Forgejo $TAG нет Windows-ассетов — в GitHub они не попадут"
              fi
            else
              echo "::warning::релиз $TAG не найден на Forgejo — Windows-ассеты пропущены"
            fi
          ) 2>&1 | tee "$RUNNER_TEMP/publish.log"
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            msg=$(tail -20 "$RUNNER_TEMP/publish.log" | tr '\n' '|')
            echo "::error::publish exit $st :: $msg"
          fi
          exit "$st"
