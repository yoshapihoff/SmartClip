name: release

# Кросс-платформенная сборка релизных артефактов SmartClip на раннерах GitHub.
# Нужна прежде всего для macOS: .app с вложенными библиотеками (macdeployqt)
# собирается ТОЛЬКО на macOS, на Linux это невозможно.
#
# Версия — из файла VERSION (авто-бамп patch на каждый коммит через
# .githooks/pre-commit), тег релиза — v<version>. Релиз обновляется на каждый
# push в main.
#
# Если репозиторий не используется через GitHub — macOS-артефакт можно получить
# и локально на маке: scripts/release-macos.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG_PREFIX: v

jobs:
  linux:
    name: Linux artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Qt6 + OpenSSL)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              cmake ninja-build g++ pkg-config \
              libssl-dev qt6-base-dev qt6-svg-dev \
              libgl1-mesa-dev libxkbcommon-dev
          sudo apt-get install -y --no-install-recommends qt6-mqtt-dev || \
              echo "Qt6 MQTT недоступен — собираю без синка"

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: scripts/release-linux.sh --jobs "$(nproc)"
        env:
          SMARTCLIP_TOOLS_DIR: ${{ runner.temp }}/smartclip-tools

      - uses: actions/upload-artifact@v4
        with:
          name: smartclip-linux-${{ steps.v.outputs.version }}
          path: dist/release-${{ steps.v.outputs.version }}/*
          if-no-files-found: error

  macos:
    name: macOS artifacts (.app + deps)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (official Qt6 + OpenSSL)
        env:
          QT_MACOS_PREFIX: ${{ secrets.QT_MACOS_PREFIX }}
        run: |
          set -eux
          brew install cmake openssl@3
          if [ -n "${QT_MACOS_PREFIX:-}" ]; then
            # Если задан секрет с префиксом Qt Online Installer — берём его.
            echo "QT_PATH=$QT_MACOS_PREFIX" >> "$GITHUB_ENV"
          else
            # Иначе ставим ОФИЦИАЛЬНЫЙ Qt через aqtinstall: brew-формула 'qt'
            # разбита на keg'и, и macdeployqt на ней падает
            # (QtPdf/QtVirtualKeyboard/libwebp и т.п.). aqt тянет комплект,
            # где macdeployqt работает штатно, плюс опциональные модули.
            python3 -m pip install --user aqtinstall
            QT_DIR="$RUNNER_TEMP/Qt"; QT_VER=6.8.1
            "$HOME/.local/bin/aqt" install-qt mac desktop "$QT_VER" clang_64 \
                -m qtmqtt qtimageformats --outputdir "$QT_DIR" \
              || "$HOME/.local/bin/aqt" install-qt mac desktop "$QT_VER" clang_64 --outputdir "$QT_DIR"
            echo "QT_PATH=$QT_DIR/$QT_VER/macos" >> "$GITHUB_ENV"
            ls "$QT_DIR/$QT_VER/macos/bin/macdeployqt"
          fi

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts (.app + zip + dmg)
        # macOS-пакет — best-effort: сбой (капризы Homebrew-qt/macdeployqt)
        # не должен блокировать выпуск Linux-артефактов в релиз.
        continue-on-error: true
        env:
          QT_MACOS_PREFIX: ${{ secrets.QT_MACOS_PREFIX }}
        run: |
          set +e
          scripts/release-macos.sh --jobs "$(sysctl -n hw.ncpu)" >"$RUNNER_TEMP/macos-build.log" 2>&1
          st=$?
          tail -30 "$RUNNER_TEMP/macos-build.log"
          if [ "$st" -ne 0 ]; then
            # Собираем все ошибки в ОДНУ аннотацию (GitHub режет список аннотаций).
            msg=$(grep -iE 'error:|error C|fatal error|FAILED|cannot|undefined' "$RUNNER_TEMP/macos-build.log" | head -25 | tr '\n' '|')
            echo "::warning::release-macos.sh exit $st (macOS-артефакт пропущен) :: ${msg:-см. лог}"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: smartclip-macos-${{ steps.v.outputs.version }}
          path: dist/release-${{ steps.v.outputs.version }}/*
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: [linux, macos]
    # Публикуем, если Linux-сборка прошла — даже если macOS споткнулся
    # (тогда релиз будет с Linux-артефактами, без macOS).
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Без actions/checkout: checkout делает clean и СТИРАЕТ ранее скачанные
      # артефакты (untracked). Версия приходит из выхода джобы linux.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Без checkout у gh нет git-контекста — задаём репозиторий явно.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set +e
          ( set -euo pipefail
            TAG="${TAG_PREFIX}${VERSION}"
            ls -la artifacts
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "SmartClip $VERSION" \
                --notes "Релиз SmartClip $VERSION (автосборка CI). Артефакты: Linux (AppImage/deb/tar.gz), macOS (.app со вложенными зависимостями)."
            gh release upload "$TAG" artifacts/* --clobber
          ) 2>&1 | tee "$RUNNER_TEMP/publish.log"
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            msg=$(tail -20 "$RUNNER_TEMP/publish.log" | tr '\n' '|')
            echo "::error::publish exit $st :: $msg"
          fi
          exit "$st"
